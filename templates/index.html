<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>标签 OCR 测试台</title><style>
:root{color-scheme:dark;--ink:#f2f5f8;--muted:#aab4c2;--panel:#18212e;--line:#2c3a4b;--accent:#45d7b5;--bg:#0c131d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#1d3545 0,transparent 32rem),var(--bg);color:var(--ink);font:16px/1.45 system-ui,"Microsoft YaHei",sans-serif}main{max-width:1240px;margin:auto;padding:3rem 1.25rem 4rem}h1{margin:0;font-size:clamp(1.8rem,4vw,3rem);letter-spacing:-.04em}.lead{color:var(--muted);margin:.5rem 0 2rem}.drop{display:block;width:100%;border:2px dashed #4d667c;border-radius:18px;padding:2.6rem 1.5rem;text-align:center;background:rgba(24,33,46,.75);cursor:pointer}.drop strong{display:block}.drop:hover,.drop.drag{border-color:var(--accent);background:#172d36}input{display:none}button{margin-top:1rem;border:0;border-radius:10px;background:var(--accent);color:#04241e;padding:.75rem 1.25rem;font-weight:800;cursor:pointer}button:disabled{opacity:.55;cursor:wait}#hint{color:var(--muted);font-size:.9rem;margin-top:.7rem}#status{margin:1.5rem 0;color:var(--accent);min-height:1.5rem}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:1.1rem}.card{overflow:hidden;border:1px solid var(--line);border-radius:16px;background:var(--panel)}.head{padding:1rem;border-bottom:1px solid var(--line)}.name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}.meta{margin-top:.35rem;color:var(--muted);font-size:.82rem}.images{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line)}figure{margin:0;background:#0b1017;min-width:0}figure:first-child{grid-column:span 2}img{width:100%;height:190px;display:block;object-fit:contain}figcaption{padding:.35rem .55rem;font-size:.75rem;color:var(--muted)}pre{margin:0;min-height:7rem;padding:1rem;background:#101923;color:#ddf9f2;white-space:pre-wrap;overflow-wrap:anywhere;font:14px/1.45 ui-monospace,Consolas,monospace}.qr{padding:.7rem 1rem;color:var(--muted);font-size:.84rem}@media(max-width:520px){main{padding-top:1.75rem}.images{grid-template-columns:1fr}figure:first-child{grid-column:auto}img{height:220px}}
</style></head><body><main><h1>标签 OCR 测试台</h1><p class="lead">上传产品照片，检查标签定位、二维码角度矫正与文字识别结果。</p><label class="drop" id="drop"><input id="files" type="file" accept="image/*" multiple><strong>拖入图片，或点击选择</strong><div id="hint">支持批量上传 JPG、PNG、BMP、TIFF、WEBP</div><button type="button" id="scan" disabled>开始识别</button></label><div id="status"></div><section id="results" class="grid"></section></main><script>
const input=document.querySelector('#files'),drop=document.querySelector('#drop'),scan=document.querySelector('#scan'),hint=document.querySelector('#hint'),status=document.querySelector('#status'),results=document.querySelector('#results');let chosen=[];function setFiles(f){chosen=[...f].filter(x=>x.type.startsWith('image/'));hint.textContent=chosen.length?`已选择 ${chosen.length} 张图片`:'支持批量上传 JPG、PNG、BMP、TIFF、WEBP';scan.disabled=!chosen.length}input.addEventListener('change',e=>setFiles(e.target.files));['dragenter','dragover'].forEach(e=>drop.addEventListener(e,x=>{x.preventDefault();drop.classList.add('drag')}));['dragleave','drop'].forEach(e=>drop.addEventListener(e,x=>{x.preventDefault();drop.classList.remove('drag')}));drop.addEventListener('drop',e=>setFiles(e.dataTransfer.files));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const image=(u,l)=>u?`<figure><img src="${u}" alt="${l}"><figcaption>${l}</figcaption></figure>`:'';function render(items){results.innerHTML=items.map(x=>`<article class="card"><div class="head"><div class="name">${esc(x.file)}</div><div class="meta">${x.label_found?'已定位标签':'未定位标签'} · 倾角 ${x.label_angle==null?'—':x.label_angle.toFixed(2)+'°'} · 置信度 ${x.confidence==null?'—':(x.confidence*100).toFixed(1)+'%'}</div></div><div class="images">${image(x.annotated_url||x.original_url,'原图 / 定位框')}${image(x.label_url,'原始标签')}${image(x.rectified_url,'二维码矫正后')}</div><pre>${esc(x.ocr_text||x.error||'未识别到文字')}</pre><div class="qr">二维码：${esc((x.qr_content||[]).join('，')||'未读取')}</div></article>`).join('')}scan.addEventListener('click',async()=>{const f=new FormData();chosen.forEach(x=>f.append('images',x));scan.disabled=true;status.textContent='正在加载 PP-OCR 并识别图片…';results.innerHTML='';try{const r=await fetch('/api/scan',{method:'POST',body:f}),d=await r.json();if(!r.ok)throw Error(d.error||'识别失败');status.textContent=`识别完成：${d.items.length} 张图片 · 引擎 ${d.engine}`;render(d.items)}catch(e){status.textContent=`失败：${e.message}`}finally{scan.disabled=!chosen.length}});
</script></body></html>
